[package]
name = "dent-daemon"
description = "The per-machine dent daemon: agent drivers, event log, git, files and checkpoints."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "dent-daemon"
path = "src/main.rs"

[dependencies]
dent-protocol.workspace = true
dent-session-holder = { path = "../session-holder" }
anyhow.workspace = true
libc = "=0.2.190"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }

[dev-dependencies]
libc = "=0.2.190"
serde_json.workspace = true

[lints]
workspace = true
