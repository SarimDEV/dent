[package]
name = "dent-daemon"
description = "The per-machine dent daemon: agent drivers, event log, git, files and checkpoints."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "dent-daemon"
path = "src/main.rs"

[dependencies]
dent-protocol.workspace = true
dent-link.workspace = true
dent-session-holder = { path = "../session-holder" }
anyhow.workspace = true
futures-util = "=0.3.34"
hex = "=0.4.3"
libc = "=0.2.190"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tokio-tungstenite = "=0.26.2"

[dev-dependencies]
dent-client-core.workspace = true
dent-link.workspace = true
dent-remote.workspace = true
futures-util = "=0.3.34"
hex = "=0.4.3"
libc = "=0.2.190"
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = "=0.26.2"

[lints]
workspace = true
