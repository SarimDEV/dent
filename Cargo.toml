[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]
# Not crates: the phone concepts (Xcode), move-git (shell) and launcher-proto (Python).
exclude = ["spikes/phone-concepts", "spikes/move-git", "spikes/launcher-proto"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SarimDEV/dent"
publish = false

[workspace.dependencies]
dent-protocol = { path = "crates/protocol" }
dent-client-core = { path = "crates/client-core" }
dent-ambient = { path = "crates/ambient" }
dent-link = { path = "crates/link" }
dent-files = { path = "crates/files" }
dent-remote = { path = "crates/remote" }
dent-update = { path = "crates/update" }

anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "sync", "time", "fs"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

# Fast inner loop: light debug info for our code, optimised dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# GPUI renders far too slowly unoptimised; gpui-component sets the same.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

# Ambient backgrounds simulate every frame; unoptimised they cost several
# times more, which would make dev runs misleading.
[profile.dev.package.dent-ambient]
opt-level = 3

[profile.release]
lto = "thin"

# The browser build: small over fast.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
