[package]
name = "spike-core"
description = "Phase 1 spike: the client core with no I/O (link state machine, Noise, pairing, chat and Markdown blocks), built for iOS and WebAssembly."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chacha20poly1305 = "=0.10.1"
hex = "=0.4.3"
hmac = "=0.12.1"
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
snow = "=0.9.6"
spake2 = "=0.4.0"
uniffi = { version = "=0.32.2", optional = true }

[features]
# Derives for the iOS bindings (spike-core-ffi turns it on).
uniffi = ["dep:uniffi"]

# No OS randomness on the web: take it from the browser's crypto.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.2.17"

[lints]
workspace = true
