[package]
name = "spike-core-ffi"
description = "Phase 1 spike: the client core for iOS, through UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "dent_core"
# staticlib for the app, cdylib only so the bindings can be read from it.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[dependencies]
spike-core = { path = "../core", features = ["uniffi"] }
uniffi = "=0.32.2"
hex = "=0.4.3"

[features]
# Only for generating the Swift: pulls in the bindgen CLI.
bindgen = ["uniffi/cli"]

[lints]
workspace = true
