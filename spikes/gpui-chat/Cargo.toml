[package]
name = "spike-gpui-chat"
description = "Phase 1 spike: GPUI chat list and diff view at 100,000 events on pinned gpui-component."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit = "=0.7.1"
gpui-fps = "=0.7.1"
# Spike 04: render Markdown, math and diagrams through the markdown spike.
spike-markdown = { path = "../markdown" }
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratex-types = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
image = { version = "=0.25.10", default-features = false }
ttf-parser = "=0.25.1"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Hides the pointer while recording the streaming comparison.
objc = "=0.2.7"
