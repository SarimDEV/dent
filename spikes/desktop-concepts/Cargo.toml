[package]
name = "spike-desktop-concepts"
description = "Desktop concepts: the session inbox, starting by typing, and the viewer panel (live previews, docs, diffs, images) in GPUI with fake agents."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit = "=0.7.1"
# Live HTML previews: the system web view as a child of the GPUI window.
wry = "=0.57.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }

# Snapshots of the live page, drawn under menus while the web view hides.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSProcessInfo", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

# Linux web views are WebKitGTK: GTK runs alongside GPUI, and on Wayland the
# page gets its own window.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
cairo-rs = { version = "0.18", features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[lints]
workspace = true
